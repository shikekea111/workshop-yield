<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d6fb8" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <title>车间产量上报</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <span class="app-logo">🏭</span>
      <h1 id="pageTitle">车间产量上报</h1>
    </div>
  </header>

  <main id="view" class="app-view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="record"><span class="tab-ico">📝</span><span class="tab-tx">上报</span></button>
    <button class="tab" data-tab="today"><span class="tab-ico">📅</span><span class="tab-tx">今日</span></button>
    <button class="tab tab-add" data-tab="add" aria-label="新增上报"><span class="tab-add-ico">＋</span></button>
    <button class="tab" data-tab="me"><span class="tab-ico">👤</span><span class="tab-tx">我的</span></button>
  </nav>

  <div id="modalRoot"></div>

  <!-- supabase-js 本地引用（国内网络更稳） -->
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/employee.js"></script>
  <script src="js/app.js"></script>
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }</script>
</body>
</html>
